name: Build and Release PocketBioacoustics APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PocketBioacoustics.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "PocketBioacoustics v1.0.1"
          body: |
            ### 📲 How to Install on Android
            1. Tap **PocketBioacoustics.apk** under **Assets** below to download.
            2. Open the downloaded file on your Android device.
            3. Tap **Install** (if prompted, allow *Install from Unknown Sources*).
          files: app/build/outputs/apk/debug/PocketBioacoustics.apk
