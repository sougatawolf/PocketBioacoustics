name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag like v1.0.0

permissions:
  contents: write # Gives the workflow permission to publish releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Extract Version from AI Studio (package.json)
        id: get_version
        run: |
          if [ -f "package.json" ]; then
            APP_VERSION=$(jq -r '.version' package.json)
          else
            # Fallback to the Git tag (without 'v') if package.json is not in root
            APP_VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "Detected AI Studio Version: $APP_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionName="${{ steps.get_version.outputs.app_version }}" -PversionCode=${{ github.run_number }}

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.get_version.outputs.app_version }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
